<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to August 4, 2025</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .text {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .countdown {
            font-size: 48px;
            font-weight: bold;
            color: #d84315; /* A bit of color for the countdown */
        }
    </style>
</head>
<body>
    <div class="text">Time until August 4, 2025:</div>
    <div class="countdown" id="countdownTimer">Loading countdown...</div>

    <script>
        function updateCountdown() {
            const targetDate = new Date('2025-08-04T00:00:00'); // Target date: August 4, 2025, at midnight
            const currentDate = new Date();
            const timeDifference = targetDate - currentDate;

            // If the target date has passed
            if (timeDifference < 0) {
                document.getElementById('countdownTimer').textContent = "The day has arrived!";
                return;
            }

            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

            document.getElementById('countdownTimer').textContent =
                `${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds`;
        }

        // Update the countdown every second
        setInterval(updateCountdown, 1000);

        // Initial call to display the countdown immediately
        updateCountdown();
    </script>
</body>
</html>
